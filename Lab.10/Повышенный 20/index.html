<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Учебная аналитика</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Учебная аналитика</h1>
        <p class="subtitle">Модульное приложение (вариант 20)</p>

        <div class="filters">
            <label>Минимальный балл:
                <input type="number" id="minScore" value="0" min="0" max="100">
            </label>
            <label>Группа:
                <select id="groupFilter">
                    <option value="">Все</option>
                    <option value="ИС-21">ИС-21</option>
                    <option value="ПО-22">ПО-22</option>
                    <option value="КС-20">КС-20</option>
                </select>
            </label>
            <button id="applyBtn">Применить фильтры</button>
        </div>

        <div id="stats" class="stats"></div>
        <div id="table-container"></div>
        <div id="error" class="error"></div>
    </div>

    <script type="module" src="js/ui.js"></script>
</body>
</html>
