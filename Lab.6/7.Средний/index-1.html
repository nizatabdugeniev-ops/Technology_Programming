<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="header">
      <p class="eyebrow">DOM · события · JavaScript</p>
      <h1>To-Do List</h1>
      <p class="subtitle">Добавьте задачу, отметьте выполненной кликом и удалите лишнее.</p>
    </header>

    <form id="add-form" class="add-form" autocomplete="off">
      <label class="sr-only" for="task-input">Новая задача</label>
      <input
        id="task-input"
        type="text"
        placeholder="Что нужно сделать?"
        maxlength="100"
        required
      >
      <button id="add-button" type="submit">Добавить</button>
    </form>

    <section class="toolbar">
      <p id="stats" class="stats" aria-live="polite">Нет задач</p>
      <button id="clear-done" type="button" class="ghost" disabled>Очистить выполненные</button>
    </section>

    <ul id="todo-list" class="list"></ul>
    <p id="empty-state" class="empty">Список пуст. Добавьте первую задачу.</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
