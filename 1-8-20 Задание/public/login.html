<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход — Учебный портал</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <button id="theme-toggle" aria-label="Переключить тему">🌙</button>
  <main class="card">
    <h1>Вход в личный кабинет</h1>
    <form id="login-form">
      <label for="login">Логин</label>
      <input id="login" name="login" type="text" required minlength="3" maxlength="32" autocomplete="username">
      <label for="password">Пароль</label>
      <input id="password" name="password" type="password" required minlength="8" maxlength="128" autocomplete="current-password">
      <button type="submit" id="submit-btn">Войти</button>
    </form>
    <div id="message" aria-live="polite"></div>
  </main>
  <script src="/app.js"></script>
</body>
</html>
